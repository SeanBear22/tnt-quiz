<!DOCTYPE html>
<html>
<head>
  <title>TNT Nerds - Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: auto 1fr 1fr;
      gap: 15px;
      height: 100vh;
      padding: 70px 30px 30px 30px;
    }

    #hostBox {
      grid-column: 1 / span 3;
      justify-self: center;
    }

    #centerArea {
      grid-column: 2;
      grid-row: 2 / span 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      width: 100%;
    }

    .frameWrap {
      position: relative;
      width: 340px;
      height: 280.5px;
    }

    /* Sits inside the cutout, so it is clipped to the same opening the video
       fills rather than spilling over the frame artwork. cover scales the
       image up or down to fill and crops the overflow, centred. */
    .frameWrap .camWindowOverlay .cardOverlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background-color: #131c2b;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: none;
    }

    .frameWrap .camWindowOverlay .cardOverlay.visible {
      display: block;
    }

    .frameWrap .camWindowOverlay iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .frameWrap .camWindowOverlay {
      overflow: hidden;
      position: absolute;
      top: 4.26%;
      left: 3.52%;
      right: 4.36%;
      bottom: 14.75%;
      background: #131c2b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a5568;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8em;
      z-index: 1;
    }

    .frameWrap .frameImg {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    .frameWrap .frameLabel {
      position: absolute;
      left: 50%;
      top: 88.5%;
      transform: translate(-50%, -50%) skewX(-10deg);
      font-family: 'Anton', sans-serif;
      color: #ffffff;
      font-size: 1.8em;
      letter-spacing: 1px;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        -3px 0 0 #000,
        3px 0 0 #000,
        0 -3px 0 #000,
        0 3px 0 #000,
        0 4px 0 #000;
      z-index: 3;
      white-space: nowrap;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #hostBox .frameLabel {
      font-size: 2.1em;
    }

    .playerFrameWrap {
      width: 300px;
      height: 247.5px;
    }

    .scorePlate {
      position: absolute;
      width: 90px;
      height: 86.4px;
      z-index: 4;
      bottom: -10px;
    }

    .scorePlate.right { right: -10px; }
    .scorePlate.left { left: -10px; }

    .scorePlate img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scorePlate .scoreNum {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      color: #ffffff;
      font-size: 2.4em;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000;
    }

    .playerSlot {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #leftCol, #rightCol {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    #leftCol { grid-column: 1; grid-row: 2 / span 2; }
    #rightCol { grid-column: 3; grid-row: 2 / span 2; }

    #questionText {
      position: relative;
      width: 100%;
      height: 100%;
      font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
    }

    .qTextOnly {
      position: absolute;
      inset: 6% 5% 8% 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2.4em;
      line-height: 1.25;
      z-index: 1;
    }

    /* SHOW ANSWERS: the question box split into quarters, one per seat, laid
       out to match where each seat sits on screen. */
    .answersGrid {
      position: absolute;
      inset: 7% 6% 9% 6%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      z-index: 1;
    }

    .answerCell {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(255, 180, 0, 0.55);
      border-radius: 10px;
      overflow: hidden;
      text-align: center;
      min-width: 0;
    }

    .answerCell .who {
      color: #ffb400;
      font-size: 1.4em;
      letter-spacing: 0.04em;
      margin-bottom: 0.25em;
    }

    .answerCell .what {
      color: #ffffff;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .answerCell .what.short  { font-size: 3em; }
    .answerCell .what.medium { font-size: 2em; }
    .answerCell .what.long   { font-size: 1.4em; }

    .answerCell .what.none {
      font-size: 1.6em;
      color: #8a94a6;
    }

    .answerCell.emptySeat {
      opacity: 0.25;
    }

    .qaImageWrap {
      position: absolute;
      top: 6%;
      left: 5%;
      right: 5%;
      bottom: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
    }

    .qaImageWrap canvas.waveform {
      width: 100%;
      height: 100%;
      display: block;
      background: #0d1420;
    }

    .qaImageWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qaTextOverlay {
      position: absolute;
      bottom: 10%;
      left: 10%;
      right: 10%;
      z-index: 2;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 2em;
      line-height: 1.3;
    }

    .qaTextOverlay.posTop {
      top: 8%;
      bottom: auto;
    }

    .qaTextOverlay.posMiddle {
      top: 50%;
      bottom: auto;
      transform: translateY(-50%);
    }

    /* An answer shown on its own over the answer image has no question
       above it, so no divider either. */
    .qaTextOverlay .answerLine.answerOnly {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .qaTextOverlay .answerLine {
      color: #2ecc71;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 3px dashed #ffb400;
    }

    #questionText .answerLine {
      color: #2ecc71;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 3px dashed #ffb400;
      display: block;
    }

    .qFrameOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .winnerLabel {
      font-size: 0.6em;
      letter-spacing: 0.08em;
      color: #e6e6e6;
      margin-bottom: 0.35em;
    }

    .winnerList {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
      color: #ffffff;
    }

    .winnerLine {
      white-space: nowrap;
      font-size: 1.35em;
    }

    /* Several names share the box, so each is set a little smaller. */
    .winnerList.count2 .winnerLine { font-size: 1.1em; }
    .winnerList.count3 .winnerLine { font-size: 0.9em; }
    .winnerList.count4 .winnerLine { font-size: 0.75em; }

    .winnerStar {
      font-size: 0.8em;
      vertical-align: 0.05em;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="hostBox">
      <div class="frameWrap">
        <div class="camWindowOverlay">HOST CAM</div>
        <img class="frameImg" src="host-frame.png" alt="">
        <div class="frameLabel" id="hostLabel">HOST</div>
      </div>
    </div>

    <div id="leftCol">
      <div class="playerSlot" data-slot="player1">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate right">
            <img src="plate_1.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
      <div class="playerSlot" data-slot="player3">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate right">
            <img src="plate_3.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="centerArea">
      <div id="questionText">
        <div class="qTextOnly">Get ready...</div>
      </div>
    </div>

    <div id="rightCol">
      <div class="playerSlot" data-slot="player2">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate left">
            <img src="plate_2.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
      <div class="playerSlot" data-slot="player4">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate left">
            <img src="plate_4.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="cam-local.js"></script>
  <script src="cam-config.js"></script>
  <script src="quiz-audio.js"></script>
  <script>
    // Everything typed by a person (names, answers, questions, round titles)
    // goes through this before being placed in the page, so it is shown as
    // text and can never run as code on the stream.
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Quarters in screen order: seats 1 and 3 sit on the left, 2 and 4 on
    // the right, so each answer appears on the same side as its player.
    function buildAnswersHtml(players) {
      const order = ['player1', 'player2', 'player3', 'player4'];
      const cells = order.map(slot => {
        const p = players[slot] || {};
        if (!p.name) {
          return `<div class="answerCell emptySeat"><div class="what none">—</div></div>`;
        }
        const answer = (p.answer || '').trim();
        const size = !answer ? 'none'
          : answer.length <= 14 ? 'short'
          : answer.length <= 40 ? 'medium' : 'long';
        return `<div class="answerCell">` +
          `<div class="who">${esc(p.name.toUpperCase())}</div>` +
          `<div class="what ${size}">${answer ? esc(answer) : 'No answer'}</div>` +
          `</div>`;
      });
      return `<div class="answersGrid">${cells.join('')}</div>`;
    }

    function buildWinnerHtml(players) {
      const joined = Object.values(players).filter(p => p.name);
      if (joined.length === 0) {
        return '<div class="qTextOnly">' + `<div class="winnerLabel">GAME OVER</div>` + '</div>';
      }

      // Top score wins; everyone on it shares the win, listed A to Z.
      const top = Math.max(...joined.map(p => p.score));
      const winners = joined
        .filter(p => p.score === top)
        .map(p => p.name.toUpperCase())
        .sort((a, b) => a.localeCompare(b));

      const label = winners.length > 1 ? 'WINNERS' : 'WINNER';
      const lines = winners
        .map(name => `<div class="winnerLine"><span class="winnerStar">⭐</span> ${esc(name)} <span class="winnerStar">⭐</span></div>`)
        .join('');

      return '<div class="qTextOnly">' +
        `<div class="winnerLabel">${label}</div>` +
        `<div class="winnerList count${Math.min(winners.length, 4)}">${lines}</div>` +
        '</div>';
    }

    // The question area is only rewritten when its content actually changes.
    // Rewriting it every second would restart the waveform animation and, on
    // pages that play the clip, cut it off.
    let lastQuestionHtml = null;
    function setQuestionHtml(box, html) {
      if (html === lastQuestionHtml) return;
      lastQuestionHtml = html;
      box.innerHTML = html;
      QuizAudio.drawAll(box);
    }

    // /viewer?noaudio is for people watching the layout; keep the clip silent
    // there as well as the camera audio. OBS uses the plain URL and needs it.
    if (location.search.indexOf('noaudio') !== -1) QuizAudio.setMuted(true);

    async function refreshViewer() {
      const response = await fetch('/api/state/viewer');
      const state = await response.json();
      const players = state.players;

      document.getElementById('hostLabel').textContent = state.hostName ? state.hostName.toUpperCase() : 'HOST';

      const hostCard = document.querySelector('#hostBox .cardOverlay');
      if (hostCard) {
        hostCard.classList.toggle('visible', !!state.hostCameraOff);
        hostCard.style.backgroundImage = state.hostCardImage
          ? `url('/uploads/${encodeURIComponent(state.hostCardImage)}')`
          : 'none';
      }

      setFeed(document.querySelector('#hostBox .camWindowOverlay'), 'host', state.hostStreamId);

      QuizAudio.sync(state);

      const questionBox = document.getElementById('questionText');
      const frameOverlayHtml = '<img class="qFrameOverlay" src="Q-frame.png" alt="">';

      if (state.gameStarted && state.showRoundIntro && state.currentRoundTitle) {
        setQuestionHtml(questionBox,
          `<div class="qTextOnly">ROUND ${state.currentRoundIndex + 1}<br>${esc(state.currentRoundTitle)}</div>` +
          frameOverlayHtml);
      } else if (state.gameStarted && state.currentQuestion && state.answersShown) {
        setQuestionHtml(questionBox, buildAnswersHtml(players) + frameOverlayHtml);
      } else if (state.gameStarted && state.currentQuestion) {
        const q = state.currentQuestion;
        const hasImage = q.questionImage || (state.revealed && q.answerImage);
        const hasMedia = hasImage || q.questionAudio;

        if (hasMedia) {
          const imgSrc = state.revealed && q.answerImage ? q.answerImage : q.questionImage;

          // An image always wins. An audio question with no image shows the
          // clip's waveform in the same space instead.
          const mediaHtml = imgSrc
            ? `<img src="/uploads/${esc(imgSrc)}">`
            : `<canvas class="waveform" data-src="/uploads/${esc(q.questionAudio)}"></canvas>`;

          // While the answer image is on screen its own settings apply: the
          // answer text can be hidden when the picture is the answer, and has
          // its own position. Otherwise the question's settings apply, and a
          // revealed answer is always shown, since without an answer image it
          // would otherwise not appear at all.
          const showingAnswerImage = state.revealed && q.answerImage;
          const questionLine = q.showText === false
            ? ''
            : `Q${state.currentQuestionIndex + 1}: ${esc(q.question)}`;
          let textHtml;
          let position;
          if (showingAnswerImage) {
            textHtml = q.answerShowText === false
              ? ''
              : `<div class="answerLine answerOnly">${esc(q.answer)}</div>`;
            position = q.answerTextPosition;
          } else {
            textHtml = questionLine;
            if (state.revealed) {
              textHtml += `<div class="answerLine">${esc(q.answer)}</div>`;
            }
            position = q.textPosition;
          }

          const posClass = position === 'top'
            ? ' posTop'
            : position === 'middle' ? ' posMiddle' : '';

          const overlayHtml = textHtml
            ? `<div class="qaTextOverlay${posClass}">${textHtml}</div>`
            : '';

          setQuestionHtml(questionBox, `
            <div class="qaImageWrap">${mediaHtml}</div>
            ${overlayHtml}
            ${frameOverlayHtml}
          `);
        } else {
          let html = `Q${state.currentQuestionIndex + 1}: ${esc(q.question)}`;
          if (state.revealed) {
            html += `<div class="answerLine">${esc(q.answer)}</div>`;
          }
          setQuestionHtml(questionBox, `<div class="qTextOnly">${html}</div>` + frameOverlayHtml);
        }
      } else if (state.gameStarted) {
        setQuestionHtml(questionBox, buildWinnerHtml(players) + frameOverlayHtml);
      } else {
        setQuestionHtml(questionBox, `<div class="qTextOnly">Get ready...</div>` + frameOverlayHtml);
      }

      document.querySelectorAll('.playerSlot').forEach(el => {
        const slot = el.dataset.slot;
        const info = players[slot];

        const frameImg = el.querySelector('.frameImg');
        const nameLabel = el.querySelector('.frameLabel');
        const scoreNum = el.querySelector('.scoreNum');

        nameLabel.textContent = info.name ? info.name.toUpperCase() : '(EMPTY)';
        scoreNum.textContent = info.score;

        const wrap = el.querySelector('.frameWrap');
        const card = wrap ? wrap.querySelector('.cardOverlay') : null;

        if (card) {
          card.classList.toggle('visible', !!info.cameraOff);
          card.style.backgroundImage = info.cardImage
            ? `url('/uploads/${encodeURIComponent(info.cardImage)}')`
            : 'none';
        }

        setFeed(el.querySelector('.camWindowOverlay'), slot, info.streamId);
        if (state.revealed && info.correct === true) {
          frameImg.src = 'player-frame-green.png';
        } else if (state.revealed && info.correct === false) {
          frameImg.src = 'player-frame-red.png';
        } else {
          frameImg.src = 'player-frame-grey.png';
        }
      });
    }

    // Each frame's cutout holds the person's feed (an iframe) and their card.
    // A feed is only shown once the server says that seat's camera is live,
    // using the random stream ID it issued, so an empty seat shows nothing and
    // nobody else can publish into it. The frame PNG sits above at z-index 2,
    // so the green/red/grey swap keeps working over the video.
    function prepareCutouts() {
      document.querySelectorAll('.camWindowOverlay').forEach(overlay => {
        overlay.textContent = '';
        const card = document.createElement('div');
        card.className = 'cardOverlay';
        overlay.appendChild(card);
      });
    }

    function setFeed(overlay, seat, streamId) {
      if (!overlay) return;
      const wanted = streamId || '';
      if ((overlay.dataset.stream || '') === wanted) return;
      overlay.dataset.stream = wanted;

      const old = overlay.querySelector('iframe');
      if (old) old.remove();
      if (!wanted) return;

      const url = vdoViewUrl(seat, wanted);
      if (!url) return;
      const frame = document.createElement('iframe');
      frame.src = url;
      frame.allow = 'autoplay';
      frame.scrolling = 'no';
      overlay.insertBefore(frame, overlay.firstChild);
    }

    prepareCutouts();

    setInterval(refreshViewer, 1000);
    refreshViewer();
  </script>
</body>
</html>
