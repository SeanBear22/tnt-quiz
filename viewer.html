<!DOCTYPE html>
<html>
<head>
  <title>TNT Nerds - Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      grid-template-rows: auto 1fr 1fr;
      gap: 15px;
      height: 100vh;
      padding: 70px 30px 30px 30px;
    }

    #hostBox {
      grid-column: 1 / span 3;
      justify-self: center;
    }

    #centerArea {
      grid-column: 2;
      grid-row: 2 / span 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      width: 100%;
    }

    .frameWrap {
      position: relative;
      width: 340px;
      height: 280.5px;
    }

    .frameWrap .camWindowOverlay {
      position: absolute;
      top: 4.26%;
      left: 3.52%;
      right: 4.36%;
      bottom: 14.75%;
      background: #131c2b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a5568;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8em;
      z-index: 1;
    }

    .frameWrap .frameImg {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      z-index: 2;
      pointer-events: none;
    }

    .frameWrap .frameLabel {
      position: absolute;
      left: 50%;
      top: 88.5%;
      transform: translate(-50%, -50%) skewX(-10deg);
      font-family: 'Anton', sans-serif;
      color: #ffffff;
      font-size: 1.8em;
      letter-spacing: 1px;
      text-shadow:
        -3px -3px 0 #000,
        3px -3px 0 #000,
        -3px 3px 0 #000,
        3px 3px 0 #000,
        -3px 0 0 #000,
        3px 0 0 #000,
        0 -3px 0 #000,
        0 3px 0 #000,
        0 4px 0 #000;
      z-index: 3;
      white-space: nowrap;
      max-width: 80%;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #hostBox .frameLabel {
      font-size: 2.1em;
    }

    .playerFrameWrap {
      width: 300px;
      height: 247.5px;
    }

    .scorePlate {
      position: absolute;
      width: 90px;
      height: 86.4px;
      z-index: 4;
      bottom: -10px;
    }

    .scorePlate.right { right: -10px; }
    .scorePlate.left { left: -10px; }

    .scorePlate img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .scorePlate .scoreNum {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Anton', sans-serif;
      color: #ffffff;
      font-size: 2.4em;
      text-shadow:
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        2px 2px 0 #000;
    }

    .playerSlot {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #leftCol, #rightCol {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
    }

    #leftCol { grid-column: 1; grid-row: 2 / span 2; }
    #rightCol { grid-column: 3; grid-row: 2 / span 2; }

    #questionText {
      position: relative;
      width: 100%;
      height: 100%;
      font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
    }

    .qTextOnly {
      position: absolute;
      inset: 6% 5% 8% 5%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 2.4em;
      line-height: 1.25;
      z-index: 1;
    }

    .qaImageWrap {
      position: absolute;
      top: 6%;
      left: 5%;
      right: 5%;
      bottom: 8%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
    }

    .qaImageWrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qaTextOverlay {
      position: absolute;
      bottom: 10%;
      left: 10%;
      right: 10%;
      z-index: 2;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 2em;
      line-height: 1.3;
    }

    .qaTextOverlay .answerLine {
      color: #2ecc71;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 3px dashed #ffb400;
    }

    #questionText .answerLine {
      color: #2ecc71;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 3px dashed #ffb400;
      display: block;
    }

    .qFrameOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    .winnerTitle {
      color: #ffb400;
      font-size: 1.3em;
      margin-bottom: 10px;
    }

    .winnerName {
      color: #2ecc71;
      font-size: 1.4em;
      margin-bottom: 20px;
    }

    .scoreboardList {
      font-size: 0.55em;
      line-height: 1.8;
      font-family: 'Trebuchet MS', Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div class="layout">
    <div id="hostBox">
      <div class="frameWrap">
        <div class="camWindowOverlay">HOST CAM</div>
        <img class="frameImg" src="host-frame.png" alt="">
        <div class="frameLabel" id="hostLabel">HOST</div>
      </div>
    </div>

    <div id="leftCol">
      <div class="playerSlot" data-slot="player1">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate right">
            <img src="plate_1.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
      <div class="playerSlot" data-slot="player3">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate right">
            <img src="plate_3.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="centerArea">
      <div id="questionText">
        <div class="qTextOnly">Get ready...</div>
      </div>
    </div>

    <div id="rightCol">
      <div class="playerSlot" data-slot="player2">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate left">
            <img src="plate_2.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
      <div class="playerSlot" data-slot="player4">
        <div class="frameWrap playerFrameWrap">
          <div class="camWindowOverlay"></div>
          <img class="frameImg" src="player-frame-grey.png" alt="">
          <div class="frameLabel"></div>
          <div class="scorePlate left">
            <img src="plate_4.png" alt="">
            <div class="scoreNum"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function buildWinnerHtml(players) {
      const joined = Object.values(players).filter(p => p.name);

      if (joined.length === 0) {
        return `<div class="qTextOnly">Show finished!</div>`;
      }

      const maxScore = Math.max(...joined.map(p => p.score));
      const winners = joined.filter(p => p.score === maxScore);
      const sorted = [...joined].sort((a, b) => b.score - a.score);

      const winnerLine = winners.length > 1
        ? `IT'S A TIE! (${maxScore} pts)`
        : `${winners[0].name.toUpperCase()} (${maxScore} pts)`;

      const scoreboardHtml = sorted
        .map(p => `${p.name}: ${p.score}`)
        .join('<br>');

      return `
        <div class="qTextOnly">
          <div class="winnerTitle">🏆 GAME OVER 🏆</div>
          <div class="winnerName">${winnerLine}</div>
          <div class="scoreboardList">${scoreboardHtml}</div>
        </div>
      `;
    }

    async function refreshViewer() {
      const response = await fetch('/api/state/viewer');
      const state = await response.json();
      const players = state.players;

      document.getElementById('hostLabel').textContent = state.hostName ? state.hostName.toUpperCase() : 'HOST';

      const questionBox = document.getElementById('questionText');
      const frameOverlayHtml = '<img class="qFrameOverlay" src="Q-frame.png" alt="">';

      if (state.gameStarted && state.showRoundIntro && state.currentRoundTitle) {
        questionBox.innerHTML =
          `<div class="qTextOnly">ROUND ${state.currentRoundIndex + 1}<br>${state.currentRoundTitle}</div>` +
          frameOverlayHtml;
      } else if (state.gameStarted && state.currentQuestion) {
        const q = state.currentQuestion;
        const hasImage = q.questionImage || (state.revealed && q.answerImage);

        if (hasImage) {
          const imgSrc = state.revealed && q.answerImage ? q.answerImage : q.questionImage;
          let textHtml = `Q${state.currentQuestionIndex + 1}: ${q.question}`;
          if (state.revealed) {
            textHtml += `<div class="answerLine">${q.answer}</div>`;
          }
          questionBox.innerHTML = `
            <div class="qaImageWrap"><img src="/uploads/${imgSrc}"></div>
            <div class="qaTextOverlay">${textHtml}</div>
            ${frameOverlayHtml}
          `;
        } else {
          let html = `Q${state.currentQuestionIndex + 1}: ${q.question}`;
          if (state.revealed) {
            html += `<div class="answerLine">${q.answer}</div>`;
          }
          questionBox.innerHTML = `<div class="qTextOnly">${html}</div>` + frameOverlayHtml;
        }
      } else if (state.gameStarted) {
        questionBox.innerHTML = buildWinnerHtml(players) + frameOverlayHtml;
      } else {
        questionBox.innerHTML = `<div class="qTextOnly">Get ready...</div>` + frameOverlayHtml;
      }

      document.querySelectorAll('.playerSlot').forEach(el => {
        const slot = el.dataset.slot;
        const info = players[slot];

        const frameImg = el.querySelector('.frameImg');
        const nameLabel = el.querySelector('.frameLabel');
        const scoreNum = el.querySelector('.scoreNum');

        nameLabel.textContent = info.name ? info.name.toUpperCase() : '(EMPTY)';
        scoreNum.textContent = info.score;

        if (state.revealed && info.correct === true) {
          frameImg.src = 'player-frame-green.png';
        } else if (state.revealed && info.correct === false) {
          frameImg.src = 'player-frame-red.png';
        } else {
          frameImg.src = 'player-frame-grey.png';
        }
      });
    }

    setInterval(refreshViewer, 1000);
    refreshViewer();
  </script>
</body>
</html>
