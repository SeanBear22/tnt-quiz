<!DOCTYPE html>
<html>
<head>
  <title>TNT Nerds - Player</title>
  <style>
    body {
      margin: 0;
      font-family: 'Trebuchet MS', Arial, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.2em;
      color: #ffb400;
      text-shadow: 2px 2px 0 #000;
      margin-bottom: 10px;
    }

    #openViewerButton {
      background: #0f3460;
      color: #fff;
      border: 2px solid #ffb400;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 0.9em;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #openViewerButton:hover {
      background: #ffb400;
      color: #1a1a2e;
    }

    #slotButtons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 25px;
    }

    .slotBtn {
      background: #0f3460;
      color: #fff;
      border: 2px solid #ffb400;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 1em;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .slotBtn:hover:not(:disabled) {
      transform: scale(1.05);
      background: #ffb400;
      color: #1a1a2e;
    }

    .slotBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #questionDisplay {
      background: #16213e;
      border: 3px solid #ffb400;
      border-radius: 12px;
      padding: 25px;
      font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
      font-size: 2.6em;
      text-align: center;
      max-width: 600px;
      margin-bottom: 25px;
      line-height: 1.25;
      overflow-wrap: break-word;
    }

    #questionDisplay canvas.waveform {
      display: block;
      width: 100%;
      max-width: 420px;
      height: 90px;
      margin: 0 auto 12px auto;
    }

    #audioUnblock {
      display: none;
      margin: 10px auto 0 auto;
      padding: 10px 18px;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      background: #ffb400;
      color: #1a1a2e;
    }

    #questionDisplay .shownTitle {
      font-size: 0.55em;
      color: #ffb400;
      margin-bottom: 10px;
    }

    #questionDisplay .shownAnswer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.6em;
      padding: 6px 4px;
      border-top: 1px solid rgba(255, 180, 0, 0.25);
      text-align: left;
    }

    #questionDisplay .shownAnswer .who {
      color: #ffb400;
      flex-shrink: 0;
    }

    #questionDisplay .shownAnswer .what {
      overflow-wrap: anywhere;
      text-align: right;
    }

    /* A block of its own, so the question text always starts on the line
       below rather than squeezing in beside the picture. */
    #questionDisplay img.qaImage {
      display: block;
      max-width: 100%;
      max-height: 400px;
      width: auto;
      height: auto;
      margin: 0 auto 10px auto;
      border-radius: 8px;
    }

    #questionDisplay .answerLine {
      color: #2ecc71;
      font-size: 0.75em;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 3px dashed #ffb400;
    }

    .winnerLabel {
      font-size: 0.7em;
      letter-spacing: 0.08em;
      color: #e6e6e6;
      margin-bottom: 0.35em;
    }

    .winnerList {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15em;
      color: #ffffff;
    }

    .winnerLine {
      white-space: nowrap;
      font-size: 1.35em;
    }

    /* Several names share the box, so each is set a little smaller. */
    .winnerList.count2 .winnerLine { font-size: 1.1em; }
    .winnerList.count3 .winnerLine { font-size: 0.9em; }
    .winnerList.count4 .winnerLine { font-size: 0.75em; }

    .winnerStar {
      font-size: 0.8em;
      vertical-align: 0.05em;
    }

    #answerArea {
      background: #16213e;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    #whoAmI {
      font-size: 1.1em;
      color: #ffb400;
      margin-bottom: 15px;
      font-weight: bold;
    }

    #answerInput {
      width: 80%;
      padding: 10px;
      font-size: 1em;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }

    #lockButton {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin: 0 auto 10px auto;
    }

    #lockButton:hover:not(:disabled) {
      background: #ff6b81;
    }

    #lockButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #statusText {
      color: #ffb400;
      font-weight: bold;
      min-height: 1.2em;
    }

    #statusText.correct { color: #2ecc71; }
    #statusText.incorrect { color: #e74c3c; }

    #scoreText {
      font-size: 1.3em;
      font-weight: bold;
      color: #ffb400;
    }
  </style>
  <style>
    #camSelf {
      width: 100%;
      max-width: 260px;
      aspect-ratio: 4 / 3;
      margin: 10px auto 0 auto;
      border: 6px solid grey;
      border-radius: 10px;
      overflow: hidden;
      background: #131c2b;
      transition: border-color 0.3s ease;
      display: none;
    }

    #camSelf iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #camControls {
      width: 100%;
      max-width: 260px;
      margin: 15px auto 0 auto;
      background: rgba(12, 18, 28, 0.6);
      border-radius: 6px;
      padding: 10px;
      font-family: sans-serif;
      font-size: 0.8em;
      color: #cbd5e0;
      text-align: left;
      display: none;
    }

    #camControls .row {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }

    #camControls button {
      flex: 1;
      padding: 6px 4px;
      font-size: 1em;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
      background: #2d3748;
      color: #e2e8f0;
    }

    #camControls button.off {
      background: #9b2c2c;
      color: #fff;
    }

    #camControls select,
    #camControls input[type=file] {
      width: 100%;
      margin-bottom: 6px;
      font-size: 0.95em;
      box-sizing: border-box;
    }

    #camControls select {
      padding: 4px;
    }

    #camControls label {
      display: block;
      margin-bottom: 2px;
      color: #718096;
    }

    #camControls .blurLabel {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      color: #cbd5e0;
    }

    #camControls .blurLabel input {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    #camControls .hint {
      color: #718096;
      font-size: 0.9em;
      line-height: 1.3;
      margin: -2px 0 6px 0;
    }

    #camControls .note {
      color: #718096;
      min-height: 1em;
    }
  </style>
  <style>
    /* --- Buzzer ----------------------------------------------------------- */
    #buzzArea {
      display: none;
      margin: 4px 0 12px 0;
    }

    #buzzButton {
      display: block;
      width: 210px;
      height: 210px;
      margin: 6px auto 14px auto;
      border-radius: 50%;
      border: 10px solid #2b2b3a;
      background: radial-gradient(circle at 38% 32%, #ff6a6a 0%, #e01b1b 38%, #9e0c0c 78%, #6d0606 100%);
      box-shadow: 0 10px 0 #4a0505, 0 14px 22px rgba(0, 0, 0, 0.55),
                  inset 0 -8px 16px rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-family: Impact, 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
      font-size: 2.2em;
      letter-spacing: 0.04em;
      text-shadow: 2px 2px 0 rgba(0, 0, 0, 0.6);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.05s ease, box-shadow 0.05s ease, filter 0.2s ease;
      line-height: 1.05;
      padding: 0 14px;
    }

    #buzzButton.open {
      animation: buzzReady 1.4s ease-in-out infinite;
    }

    @keyframes buzzReady {
      0%, 100% { border-color: #2b2b3a; }
      50% { border-color: #ffd400; }
    }

    #buzzButton.pressed,
    #buzzButton:active {
      transform: translateY(8px);
      box-shadow: 0 2px 0 #4a0505, 0 4px 10px rgba(0, 0, 0, 0.5),
                  inset 0 -4px 10px rgba(0, 0, 0, 0.35);
    }

    /* Won the buzz: a thick yellow ring, which reads clearly whatever your
       colour vision. */
    #buzzButton.mine {
      border-color: #ffd400;
      box-shadow: 0 10px 0 #4a0505, 0 0 0 6px rgba(255, 212, 0, 0.35), 0 0 40px rgba(255, 212, 0, 0.7);
    }

    #buzzButton.closed,
    #buzzButton.taken,
    #buzzButton.locked {
      filter: grayscale(1) brightness(0.65);
      cursor: default;
      font-size: 1.5em;
    }

    #buzzButton.locked {
      background: repeating-linear-gradient(45deg, #5a5a5a 0 14px, #444 14px 28px);
    }

    #buzzStatus {
      font-weight: bold;
      font-size: 1.1em;
      color: #ffd400;
      min-height: 1.3em;
      margin-bottom: 10px;
    }

    #hotkeyRow {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: center;
      font-size: 0.9em;
      color: #cbd5e0;
    }

    #hotkeyRow kbd {
      display: inline-block;
      min-width: 1.6em;
      padding: 3px 8px;
      border: 1px solid #718096;
      border-bottom-width: 3px;
      border-radius: 5px;
      background: #2d3748;
      color: #ffffff;
      font-family: inherit;
      font-weight: bold;
    }

    #hotkeyRow button,
    #hotkeyRow label {
      font-size: 0.95em;
    }

    #hotkeyRow button {
      padding: 4px 10px;
      border: 0;
      border-radius: 4px;
      background: #2d3748;
      color: #e2e8f0;
      cursor: pointer;
    }

    #hotkeyFocus {
      margin: 8px auto 0 auto;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9em;
      font-weight: bold;
      cursor: pointer;
      max-width: 320px;
    }

    #hotkeyFocus.ready { background: #1f3b2b; color: #b7f0c8; cursor: default; }
    #hotkeyFocus.notReady { background: #ffd400; color: #1a1a2e; }
  </style>
</head>
<body>
  <h1>TNT NERDS QUIZ</h1>

  <button id="openViewerButton">Open Viewer Screen</button>

  <div id="slotButtons">
    <button class="slotBtn" data-slot="player1">Player 1 - Empty</button>
    <button class="slotBtn" data-slot="player2">Player 2 - Empty</button>
    <button class="slotBtn" data-slot="player3">Player 3 - Empty</button>
    <button class="slotBtn" data-slot="player4">Player 4 - Empty</button>
  </div>

  <div id="questionDisplay">Waiting for a question...</div>
  <button id="audioUnblock" type="button">&#128266; Tap to hear the clip</button>

  <div id="answerArea" style="display:none;">
    <p id="scoreText">Score: 0</p>
    <p id="whoAmI"></p>
    <div id="buzzArea">
      <button id="buzzButton" type="button" class="closed">WAIT</button>
      <div id="buzzStatus"></div>
      <div id="hotkeyRow">
        Hotkey: <kbd id="hotkeyName">Space</kbd>
        <button id="hotkeyChange" type="button">Change</button>
        <label><input type="checkbox" id="buzzSoundsInput" checked> Hear buzzes</label>
      </div>
      <div id="hotkeyFocus" class="ready"></div>
    </div>
    <input type="text" id="answerInput" autocomplete="off" placeholder="Type your answer">
    <button id="lockButton">LOCK IN</button>
    <p id="statusText"></p>

    <div id="camControls">
      <div class="row">
        <button id="micBtn" type="button" class="off">Mic MUTED</button>
        <button id="camBtn" type="button">Camera on</button>
      </div>
      <label for="micSelect">Microphone</label>
      <select id="micSelect"></select>
      <label for="vidSelect">Camera</label>
      <select id="vidSelect"></select>
      <label class="blurLabel">
        <input type="checkbox" id="blurInput">
        Blur my background
      </label>
      <label for="cardInput">Card shown when camera is off</label>
      <input id="cardInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp">
      <div class="hint">Best at 4:3, around 700&times;500. Other shapes are scaled to fill and cropped from the centre.</div>
      <div class="note" id="camNote"></div>
    </div>
    <div id="camSelf"></div>
  </div>

  <script src="cam-local.js"></script>
  <script src="cam-config.js"></script>
  <script src="quiz-audio.js"></script>
  <script src="buzzer.js"></script>
  <script>
    // Token issued by the server when this browser claims a slot. It proves
    // which player is submitting, so a slot cannot be answered for by anyone
    // else.
    let myToken = localStorage.getItem('tntQuizToken');
    let mySlot = localStorage.getItem('tntQuizSlot');
    let hasLockedIn = false;
    let answersClosed = false;
    let restoredFromStorage = false;
    let lastState = null;

    // Everything typed by a person is shown as text, never run as code.
    function esc(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    document.getElementById('openViewerButton').addEventListener('click', () => {
      window.open('/viewer', '_blank');
    });

    function buildWinnerHtml(players) {
      const joined = Object.values(players).filter(p => p.name);
      if (joined.length === 0) {
        return `<div class="winnerLabel">GAME OVER</div>`;
      }

      // Top score wins; everyone on it shares the win, listed A to Z.
      const top = Math.max(...joined.map(p => p.score));
      const winners = joined
        .filter(p => p.score === top)
        .map(p => p.name.toUpperCase())
        .sort((a, b) => a.localeCompare(b));

      const label = winners.length > 1 ? 'WINNERS' : 'WINNER';
      const lines = winners
        .map(name => `<div class="winnerLine"><span class="winnerStar">⭐</span> ${esc(name)} <span class="winnerStar">⭐</span></div>`)
        .join('');

      return `<div class="winnerLabel">${label}</div>` +
        `<div class="winnerList count${Math.min(winners.length, 4)}">${lines}</div>`;
    }

    // The question area is only rewritten when its content actually changes,
    // so the waveform is not redrawn from scratch every second.
    let lastQuestionHtml = null;
    function setQuestionHtml(box, html) {
      if (html === lastQuestionHtml) return;
      lastQuestionHtml = html;
      box.innerHTML = html;
      QuizAudio.drawAll(box);
    }

    // Browsers refuse to start sound on a page nobody has clicked since it
    // loaded, which happens if a player reloads mid-game. Offer a button.
    const unblockBtn = document.getElementById('audioUnblock');
    QuizAudio.onBlocked = () => { unblockBtn.style.display = 'block'; };
    unblockBtn.addEventListener('click', () => {
      unblockBtn.style.display = 'none';
      QuizAudio.resume();
    });

    // Checks can overlap on a slow connection. An answer to a check sent
    // before this browser took its seat says "no seat", and acting on it would
    // throw the new seat away. So each answer is only used if the seat token
    // hasn't changed since it was asked, and it isn't older than one already used.
    let stateRequestCount = 0;
    let lastStateApplied = 0;

    async function refreshButtons() {
      const requestNumber = ++stateRequestCount;
      const tokenUsed = myToken;
      const response = await fetch('/api/state', {
        headers: tokenUsed ? { 'X-Player-Token': tokenUsed } : {}
      });
      const state = await response.json();
      if (tokenUsed !== myToken || requestNumber < lastStateApplied) return;
      lastStateApplied = requestNumber;
      const players = state.players;
      lastState = state;

      // The server, not this browser's memory, decides which seat we hold.
      // If the seat was released or the server restarted, let it go and stop
      // the camera, so it is not left publishing into a seat we no longer own.
      if (mySlot && (!state.you || state.you.slot !== mySlot)) {
        loseSeat();
      }
      if (state.you && mySlot === state.you.slot) {
        mountSelfCamera(mySlot, state.you.streamId);
      }

      QuizAudio.sync(state);

      const questionBox = document.getElementById('questionDisplay');

      if (state.gameStarted && state.showRoundIntro && state.currentRoundTitle) {
        setQuestionHtml(questionBox, `ROUND ${state.currentRoundIndex + 1}<br>${esc(state.currentRoundTitle)}`);
      } else if (state.gameStarted && state.currentQuestion && state.answersShown) {
        const rows = ['player1', 'player2', 'player3', 'player4']
          .filter(slot => players[slot] && players[slot].name)
          .map(slot => {
            const p = players[slot];
            const answer = (p.answer || '').trim();
            return `<div class="shownAnswer"><span class="who">${esc(p.name)}</span>` +
              `<span class="what">${answer ? esc(answer) : 'No answer'}</span></div>`;
          });
        setQuestionHtml(questionBox,
          `<div class="shownTitle">EVERYONE'S ANSWERS</div>${rows.join('')}`);
      } else if (state.gameStarted && state.currentQuestion) {
        const q = state.currentQuestion;
        let html = '';
        if (q.questionImage) {
          html += `<img class="qaImage" src="/uploads/${esc(q.questionImage)}">`;
        } else if (q.questionAudio) {
          html += `<canvas class="waveform" data-src="/uploads/${esc(q.questionAudio)}"></canvas>`;
        }
        html += q.question
          ? `Q${state.currentQuestionIndex + 1}: ${esc(q.question)}`
          : `Q${state.currentQuestionIndex + 1}`;
        if (state.revealed) {
          html += `<div class="answerLine">`;
          if (q.answerImage) {
            html += `<img class="qaImage" src="/uploads/${esc(q.answerImage)}"><br>`;
          }
          html += `${esc(q.answer)}</div>`;
        }
        setQuestionHtml(questionBox, html);
      } else if (state.gameStarted) {
        setQuestionHtml(questionBox, buildWinnerHtml(players));
      } else {
        setQuestionHtml(questionBox, 'Waiting for a question...');
      }

      document.querySelectorAll('.slotBtn').forEach(btn => {
        const slot = btn.dataset.slot;
        const info = players[slot];

        if (info.name) {
          btn.textContent = `Player ${slot.slice(-1)} - ${info.name}`;
          btn.disabled = (mySlot !== slot);
        } else {
          btn.textContent = `Player ${slot.slice(-1)} - Empty`;
          btn.disabled = false;
        }
      });

      if (mySlot && players[mySlot] && players[mySlot].name && !restoredFromStorage) {
        restoredFromStorage = true;
        document.getElementById('whoAmI').textContent = `${players[mySlot].name}/Player${mySlot.slice(-1)}`;
        document.getElementById('answerArea').style.display = 'block';

        if (players[mySlot].answer) {
          hasLockedIn = true;
          document.getElementById('answerInput').disabled = true;
          document.getElementById('lockButton').disabled = true;
          document.getElementById('statusText').textContent = 'Answer locked in! Waiting for reveal...';
        }
      }

      if (mySlot) {
        const myInfo = players[mySlot];
        const statusText = document.getElementById('statusText');

        if (!myInfo.answer && hasLockedIn) {
          hasLockedIn = false;
          document.getElementById('answerInput').disabled = false;
          document.getElementById('answerInput').value = '';
          document.getElementById('lockButton').disabled = false;
          statusText.textContent = '';
          statusText.className = '';
        }

        // Answering closes once everyone's answers are shown, or the answer
        // is revealed, whichever comes first.
        const closedNow = state.revealed || state.answersShown;
        if (closedNow && !hasLockedIn && !answersClosed) {
          answersClosed = true;
          document.getElementById('answerInput').disabled = true;
          document.getElementById('lockButton').disabled = true;
          statusText.textContent = buzzerRoundNow(state) ? '' : 'Answers are closed';
          statusText.className = '';
        } else if (!closedNow && answersClosed) {
          answersClosed = false;
          document.getElementById('answerInput').disabled = false;
          document.getElementById('answerInput').value = '';
          document.getElementById('lockButton').disabled = false;
          statusText.textContent = '';
          statusText.className = '';
        }

        const webcamBox = document.getElementById('camSelf');
        if (state.revealed && myInfo.correct === true) {
          webcamBox.style.borderColor = '#2ecc71';
          statusText.textContent = 'Correct!';
          statusText.className = 'correct';
        } else if (state.revealed && myInfo.correct === false) {
          webcamBox.style.borderColor = '#e74c3c';
          statusText.textContent = 'Incorrect';
          statusText.className = 'incorrect';
        } else {
          webcamBox.style.borderColor = 'grey';
        }

        document.getElementById('scoreText').textContent = `Score: ${myInfo.score}`;
      }

      TNTBuzzer.setSounds(state.buzzerSounds);
      buzzWatch.feed(state.buzz);
      renderBuzzer();
    }

    document.querySelectorAll('.slotBtn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (mySlot) return;

        const slot = btn.dataset.slot;
        const name = prompt('Enter your name:');
        if (!name || !name.trim()) return;

        let code = '';
        if (lastState && lastState.joinCodeRequired) {
          code = prompt('Enter the join code:');
          if (code === null) return;
        }

        const response = await fetch('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot, name, code })
        });
        const result = await response.json();

        if (result.success) {
          mySlot = slot;
          myToken = result.token;
          localStorage.setItem('tntQuizSlot', slot);
          localStorage.setItem('tntQuizToken', result.token);
          mountSelfCamera(slot, result.streamId);
          document.getElementById('whoAmI').textContent = `${name}/Player${slot.slice(-1)}`;
          document.getElementById('answerArea').style.display = 'block';
        } else {
          alert(result.message);
        }
        refreshButtons();
      });
    });

    // Enter in the answer box locks the answer in, same as the button.
    document.getElementById('answerInput').addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing) return;
      event.preventDefault();
      const button = document.getElementById('lockButton');
      if (!button.disabled) button.click();
    });

    document.getElementById('lockButton').addEventListener('click', async () => {
      const answer = document.getElementById('answerInput').value;
      if (!answer || !mySlot) return;

      const response = await fetch('/api/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Player-Token': myToken || ''
        },
        body: JSON.stringify({ answer })
      });
      const result = await response.json();

      if (result.success) {
        hasLockedIn = true;
        document.getElementById('statusText').textContent = 'Answer locked in! Waiting for reveal...';
        document.getElementById('answerInput').disabled = true;
        document.getElementById('lockButton').disabled = true;
      } else if (result.message) {
        document.getElementById('statusText').textContent = result.message;
      }
    });

    // --- Feed controls -----------------------------------------------------
    // The mic and camera are genuinely stopped in the browser, not merely
    // covered up. The server is told separately so the viewer page can show a
    // mic-off badge or swap in the card.

    let camFrame = null;
    let micOn = false;        // cameras join muted; voice is on Discord
    let cameraOn = true;
    let devicesNamed = false;
    let currentStreamId = null;

    function showMicState() {
      const btn = document.getElementById('micBtn');
      btn.textContent = micOn ? 'Mic on' : 'Mic MUTED';
      btn.classList.toggle('off', !micOn);
    }

    function toFrame(message) {
      if (camFrame && camFrame.contentWindow) {
        camFrame.contentWindow.postMessage(message, '*');
      }
    }

    function note(text) {
      document.getElementById('camNote').textContent = text || '';
    }

    async function reportStatus() {
      try {
        await fetch('/api/player/status', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Player-Token': myToken || ''
          },
          body: JSON.stringify({ micMuted: !micOn, cameraOff: !cameraOn, camLive: camMounted })
        });
      } catch (err) {
        note('Could not reach the server');
      }
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      micOn = !micOn;
      toFrame({ mic: micOn });
      showMicState();
      reportStatus();
    });

    document.getElementById('camBtn').addEventListener('click', () => {
      cameraOn = !cameraOn;
      toFrame({ action: 'camera', value: cameraOn });
      const btn = document.getElementById('camBtn');
      btn.textContent = cameraOn ? 'Camera on' : 'Camera OFF';
      btn.classList.toggle('off', !cameraOn);
      reportStatus();
    });

    // --- Device selection --------------------------------------------------
    // Device IDs are scoped to the origin that listed them, so the list has to
    // come from inside the VDO.Ninja frame and the IDs go straight back to it.
    // Labels are stored too: IDs change when a USB device is replugged.

    function savedDevice(kind) {
      try {
        return JSON.parse(localStorage.getItem('tntQuizDevice_' + kind) || 'null');
      } catch (err) {
        return null;
      }
    }

    function saveDevice(kind, id, label) {
      localStorage.setItem('tntQuizDevice_' + kind, JSON.stringify({ id, label }));
    }

    function fillSelect(select, devices, kind) {
      select.innerHTML = '';
      devices.forEach(device => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.textContent = device.label || 'Unnamed device';
        select.appendChild(option);
      });

      const saved = savedDevice(kind);
      if (!saved) return;

      let match = devices.find(d => d.deviceId === saved.id);
      if (!match && saved.label) {
        match = devices.find(d => d.label === saved.label);
      }
      if (!match) return;
      select.value = match.deviceId;

      // Only switch device once the stream is actually publishing. Applying it
      // mid-startup interrupts autostart and leaves the join screen up.
      if (devicesNamed) applyDevice(kind, match.deviceId, match.label);
    }

    function applyDevice(kind, id, label) {
      if (kind === 'audio') toFrame({ changeAudioDevice: id });
      else toFrame({ changeVideoDevice: id });
      saveDevice(kind, id, label);
    }

    window.addEventListener('message', event => {
      if (!camFrame || event.source !== camFrame.contentWindow) return;
      const data = event.data;
      if (!data || !Array.isArray(data.deviceList)) return;

      const mics = data.deviceList.filter(d => d.kind === 'audioinput');
      const cams = data.deviceList.filter(d => d.kind === 'videoinput');
      fillSelect(document.getElementById('micSelect'), mics, 'audio');
      fillSelect(document.getElementById('vidSelect'), cams, 'video');

      devicesNamed = mics.concat(cams).some(d => d.label);
      note(devicesNamed
        ? mics.length + ' mic(s), ' + cams.length + ' camera(s) found'
        : 'Waiting for camera permission...');
    });

    ['micSelect', 'vidSelect'].forEach(id => {
      document.getElementById(id).addEventListener('mousedown', () => {
        toFrame({ getDeviceList: true, cib: 'setup' });
      });
    });

    document.getElementById('micSelect').addEventListener('change', event => {
      const option = event.target.selectedOptions[0];
      applyDevice('audio', event.target.value, option ? option.textContent : '');
      note('Microphone changed');
    });

    document.getElementById('vidSelect').addEventListener('change', event => {
      const option = event.target.selectedOptions[0];
      applyDevice('video', event.target.value, option ? option.textContent : '');
      note('Camera changed');
    });

    // --- Card upload -------------------------------------------------------

    document.getElementById('cardInput').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      note('Uploading card...');
      const form = new FormData();
      form.append('card', file);
      try {
        const response = await fetch('/api/player/card', {
          method: 'POST',
          headers: { 'X-Player-Token': myToken || '' },
          body: form
        });
        const result = await response.json();
        note(result.success ? 'Card saved' : (result.message || 'Upload failed'));
      } catch (err) {
        note('Upload failed');
      }
    });

    // Joining the quiz is joining the call. Opening the page and claiming a
    // slot starts the camera; there is no second tab to remember.
    let camMounted = false;

    // Blur is a URL parameter, so changing it rebuilds the frame. That drops
    // and re-establishes the connection, which takes a couple of seconds.
    function blurWanted() {
      return localStorage.getItem('tntQuizBlur') === '1';
    }

    function unmountSelfCamera() {
      const holder = document.getElementById('camSelf');
      holder.textContent = '';
      holder.style.display = 'none';
      document.getElementById('camControls').style.display = 'none';
      camFrame = null;
      camMounted = false;
      currentStreamId = null;
      devicesNamed = false;
    }

    function loseSeat() {
      mySlot = null;
      myToken = null;
      localStorage.removeItem('tntQuizSlot');
      localStorage.removeItem('tntQuizToken');
      unmountSelfCamera();
      restoredFromStorage = false;
      document.getElementById('answerArea').style.display = 'none';
      document.getElementById('whoAmI').textContent = '';
    }

    // Publishes on the stream ID the server issued for this seat. Called on
    // every refresh; does nothing unless the ID has changed.
    function mountSelfCamera(slot, streamId) {
      if (!slot || !streamId) return;
      if (camMounted && currentStreamId === streamId) return;
      const url = vdoPushUrl(slot, { blur: blurWanted(), streamId });
      if (!url) return;
      const holder = document.getElementById('camSelf');
      holder.textContent = '';
      const frame = document.createElement('iframe');
      frame.src = url;
      frame.allow = 'camera; microphone; autoplay; fullscreen; display-capture';
      frame.scrolling = 'no';
      holder.appendChild(frame);
      holder.style.display = 'block';
      camFrame = frame;
      camMounted = true;
      currentStreamId = streamId;
      micOn = false;            // a fresh camera always starts muted
      showMicState();

      document.getElementById('camControls').style.display = 'block';
      document.getElementById('blurInput').checked = blurWanted();

      // Device labels stay blank until the browser has granted camera
      // permission, which happens a little after the frame loads. Ask a few
      // times rather than once, and stop as soon as real labels arrive.
      frame.addEventListener('load', () => {
        [1500, 4000, 8000, 15000].forEach(delay => {
          setTimeout(() => {
            if (!devicesNamed) toFrame({ getDeviceList: true, cib: 'setup' });
          }, delay);
        });
      });

      reportStatus();
    }

    document.getElementById('blurInput').addEventListener('change', event => {
      localStorage.setItem('tntQuizBlur', event.target.checked ? '1' : '0');
      if (!mySlot || !currentStreamId) return;
      note('Restarting camera...');
      const id = currentStreamId;
      camMounted = false;
      camFrame = null;
      devicesNamed = false;
      mountSelfCamera(mySlot, id);
    });

    // --- Buzzer ------------------------------------------------------------
    // In a buzzer round the answer box is swapped for a big red button. The
    // server decides who was first; this page only shows what it says.

    function buzzerRoundNow(state) {
      return !!(state && state.buzz && state.buzz.round);
    }

    const SOUNDS_KEY = 'tntQuizHearBuzzes';
    const soundsInput = document.getElementById('buzzSoundsInput');
    try { soundsInput.checked = localStorage.getItem(SOUNDS_KEY) !== 'off'; } catch (e) {}
    soundsInput.addEventListener('change', () => {
      try { localStorage.setItem(SOUNDS_KEY, soundsInput.checked ? 'on' : 'off'); } catch (e) {}
    });

    const buzzWatch = TNTBuzzer.createWatcher({
      sound: false,
      onBuzz: buzz => {
        if (soundsInput.checked && buzz.holder) TNTBuzzer.play(buzz.holder);
      },
      onChange: () => renderBuzzer()
    });

    function nameOf(slot) {
      const p = lastState && lastState.players[slot];
      return (p && p.name) || 'Someone';
    }

    function renderBuzzer() {
      const state = lastState;
      const buzz = buzzWatch.latest;
      const on = !!(mySlot && state && buzz && buzz.round);
      const area = document.getElementById('buzzArea');
      area.style.display = on ? 'block' : 'none';
      document.getElementById('answerInput').style.display = on ? 'none' : '';
      document.getElementById('lockButton').style.display = on ? 'none' : '';
      if (!on) return;

      const btn = document.getElementById('buzzButton');
      const status = document.getElementById('buzzStatus');
      const me = state.players[mySlot] || {};
      let cls = 'closed';
      let label = 'WAIT';
      let text = '';

      if (buzz.open) {
        if (buzz.holder === mySlot) {
          cls = 'mine'; label = "YOU'RE IN!"; text = 'Say your answer!';
        } else if (buzz.lockedOut.includes(mySlot)) {
          cls = 'locked'; label = 'LOCKED OUT';
          text = "Wrong answer. You can buzz again once everyone else has had a go, or on the next question.";
        } else if (buzz.holder) {
          cls = 'taken'; label = nameOf(buzz.holder).toUpperCase() + '<br>BUZZED';
          text = `${nameOf(buzz.holder)} got there first.`;
        } else {
          cls = 'open'; label = 'BUZZ!';
          text = buzz.lockedOut.length
            ? 'Buzzers open again. Go!'
            : `Buzzers open. Worth ${buzz.points} point${buzz.points === 1 ? '' : 's'}.`;
        }
      } else if (state.phase === 'roundIntro') {
        text = 'Buzzer round! Get ready.';
      } else if (state.revealed) {
        label = 'CLOSED';
        if (me.correct === true) text = `Correct! +${buzz.points}`;
        else if (buzz.holder && state.players[buzz.holder] && state.players[buzz.holder].correct === true) {
          text = `${nameOf(buzz.holder)} got it.`;
        } else text = 'Nobody got that one.';
      }

      if (buzzPending && cls === 'open') cls += ' pressed';
      btn.className = cls;
      btn.innerHTML = label.split('<br>').map(esc).join('<br>');
      status.textContent = text;
      renderHotkeyFocus();
    }

    let buzzPending = false;

    async function pressBuzzer() {
      const buzz = buzzWatch.latest;
      if (!mySlot || !buzz || !buzz.round || buzzPending) return;
      if (lastState && lastState.phase !== 'question') return;
      buzzPending = true;
      renderBuzzer();
      try {
        const response = await fetch('/api/buzz', {
          method: 'POST',
          headers: { 'X-Player-Token': myToken || '' }
        });
        const result = await response.json();
        // Feeding the reply in straight away plays the sound and lights the
        // button now, rather than on the next poll.
        if (result.buzz) buzzWatch.feed(result.buzz);
      } catch (err) {
        document.getElementById('buzzStatus').textContent = "Couldn't reach the server. Try again.";
      } finally {
        buzzPending = false;
        renderBuzzer();
      }
    }

    // pointerdown rather than click: it fires the moment the button goes
    // down, not when it is let go.
    document.getElementById('buzzButton').addEventListener('pointerdown', event => {
      if (event.button !== undefined && event.button !== 0) return;
      event.preventDefault();
      pressBuzzer();
    });
    // Space or Enter on the focused button would otherwise fire a click too.
    document.getElementById('buzzButton').addEventListener('click', event => event.preventDefault());

    // --- Hotkey ------------------------------------------------------------
    // Stored per browser. The key only reaches this page while the quiz tab
    // is the active window and the camera preview isn't selected, so the strip
    // under the button says whether it will work right now.
    const HOTKEY_KEY = 'tntQuizBuzzKey';
    let hotkey = { code: 'Space', label: 'Space' };
    try {
      const saved = JSON.parse(localStorage.getItem(HOTKEY_KEY) || 'null');
      if (saved && saved.code) hotkey = saved;
    } catch (e) {}
    let capturingHotkey = false;

    function showHotkey() {
      document.getElementById('hotkeyName').textContent = capturingHotkey ? 'Press a key…' : hotkey.label;
      document.getElementById('hotkeyChange').textContent = capturingHotkey ? 'Cancel' : 'Change';
    }
    showHotkey();

    function keyLabel(event) {
      if (event.code === 'Space') return 'Space';
      if (event.key && event.key.length === 1) return event.key.toUpperCase();
      return event.key || event.code;
    }

    document.getElementById('hotkeyChange').addEventListener('click', event => {
      capturingHotkey = !capturingHotkey;
      showHotkey();
      event.currentTarget.blur();
    });

    function typingInField(target) {
      return target && (target.tagName === 'INPUT' && target.type === 'text'
        || target.tagName === 'TEXTAREA' || target.isContentEditable);
    }

    document.addEventListener('keydown', event => {
      if (capturingHotkey) {
        event.preventDefault();
        capturingHotkey = false;
        if (event.key !== 'Escape') {
          hotkey = { code: event.code, label: keyLabel(event) };
          try { localStorage.setItem(HOTKEY_KEY, JSON.stringify(hotkey)); } catch (e) {}
        }
        showHotkey();
        return;
      }
      if (event.code !== hotkey.code || event.repeat || typingInField(event.target)) return;
      const buzz = buzzWatch.latest;
      if (!mySlot || !buzz || !buzz.round) return;
      event.preventDefault();   // stops Space scrolling the page
      pressBuzzer();
    }, true);

    function hotkeyReady() {
      const active = document.activeElement;
      return document.hasFocus() && !(active && active.tagName === 'IFRAME');
    }

    function renderHotkeyFocus() {
      const box = document.getElementById('hotkeyFocus');
      if (hotkeyReady()) {
        box.className = 'ready';
        box.textContent = '\u2328 Hotkey ready';
      } else {
        box.className = 'notReady';
        box.textContent = '\u2328 Hotkey off: click here to turn it back on';
      }
    }

    // Clicking the strip puts the keyboard back on this page, including when
    // the camera preview had taken it.
    document.getElementById('hotkeyFocus').addEventListener('pointerdown', () => {
      if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
        document.activeElement.blur();
      }
      window.focus();
      setTimeout(renderHotkeyFocus, 0);
    });
    window.addEventListener('focus', renderHotkeyFocus);
    window.addEventListener('blur', () => setTimeout(renderHotkeyFocus, 0));
    setInterval(() => {
      if (document.getElementById('buzzArea').style.display === 'block') renderHotkeyFocus();
    }, 400);

    setInterval(refreshButtons, 1000);
    refreshButtons();
  </script>
</body>
</html>
